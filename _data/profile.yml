short_bio: >-
  Hi, I’m Ploy, a machine learning engineer and PhD graduate based in Bangkok, Thailand. My research interests include computer vision, representation learning, and multimodal learning. More recently, my work has focused on natural language processing for medical applications. I completed my PhD in Computer Science at VISTEC, where I was advised by <a href="https://www.supasorn.com/" target="_blank">Prof. Supasorn Suwajanakorn</a> in the <a href="https://vistec.ist/vision/" target="_blank">Vision and Learning Lab</a> and co-advised by <a href="https://niessnerlab.org/" target="_blank">Prof. Matthias Nießner</a> at TUM and <a href="https://vistec.ac.th/faculty-adjunct-professors-ist-sarana-nutanong" target="_blank">Prof. Sarana Nutanong</a>. My work has appeared in top-tier machine learning and computer vision conferences and journals.
interests: "Outside of work, I enjoy drawing, petting small animals, playing games, and listening to music. My favorite bands are Morfonica and Ikka Dumb Rock!."


